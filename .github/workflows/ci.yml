name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=sharedimp --cov-report=term-missing
      - name: Run examples
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python examples/regression_quickstart.py
          python examples/classification.py
          python examples/grouped_cv_pipeline.py

  test-minimum-versions:
    name: test (minimum supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: >
          python -m pip install
          "numpy==1.23.5" "scipy==1.9.3" "pandas==1.5.3"
          "scikit-learn==1.3.2" "joblib==1.2.0" "pytest==7.4.4"
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && python -c "import sharedimp; print(sharedimp.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
